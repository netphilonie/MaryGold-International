<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff login | Marygold International School</title>
  <link rel="icon" href="images/marygold-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="stylesheet.css">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <header id="site-header" class="site-header"></header>

  <main class="login staff" style="--img:url(images/login-staff.jpg)">
    <div class="login-card glass">
      <nav class="roles" aria-label="Choose your login">
        <a href="student-login.html">Student</a>
        <a href="parent-login.html">Parent</a>
        <a href="staff-login.html" aria-current="page">Staff</a>
      </nav>
      <h1>Staff login</h1>
      <p class="sub">Sign in to your staff account.</p>

      <form id="login-form" novalidate>
        <label for="user">Staff ID or email</label>
        <input id="user" name="user" type="text" autocomplete="username" required>
        <label for="pass">Password</label>
        <div class="pw">
          <input id="pass" name="pass" type="password" autocomplete="current-password" required>
          <button class="show" type="button" aria-pressed="false">Show</button>
        </div>
        <div class="row"><a href="#">Forgot password?</a></div>
        <button class="btn login-btn" type="submit">Log in</button>
        <div class="status" id="msg" role="status" aria-live="polite"></div>
      </form>
      <p class="alt">Need access? Contact the school office.</p>
    </div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>
  <script src="script.js"></script>
  <script src="login.js"></script>
</body>
</html>
