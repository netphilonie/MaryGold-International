<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Marygold International School</title>
  <link rel="icon" href="images/marygold-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="stylesheet.css">
  <link rel="stylesheet" href="pages.css">
</head>
<body>
  <header id="site-header" class="site-header"></header>
  <main>
    <section class="page-title"><div class="wrap"><h1>Contact</h1><p>We would love to hear from you.</p></div></section>
    <section class="section"><div class="wrap">
      <div class="contact-grid">
        <ul class="info">
          <li><strong>Address</strong><span data-school="address"></span></li>
          <li><strong>Phone</strong><a data-school="phone" href="#"></a></li>
          <li><strong>WhatsApp</strong><a data-school="whatsapp" href="#" target="_blank" rel="noopener">Chat with us</a></li>
          <li><strong>Email</strong><a data-school="email" href="#"></a></li>
        </ul>
        <form class="form" data-wa="Message for Marygold International School">
          <div><label for="n">Your name</label><input id="n" name="name" data-label="Name" required></div>
          <div><label for="p">Phone number</label><input id="p" name="phone" type="tel" data-label="Phone"></div>
          <div><label for="m">Message</label><textarea id="m" name="message" data-label="Message" required></textarea></div>
          <button class="btn btn-gold" type="submit">Send on WhatsApp</button>
          <p class="note">This opens WhatsApp with your message ready to send to the school.</p>
        </form>
      </div>
      <div class="map"><iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d15902.112423886503!2d7.057431443648207!3d4.8507640719969665!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x1069cd4390dbbf99%3A0x5d23838145b7839b!2sMarygold%20International%20School!5e0!3m2!1sen!2sng!4v1792787120247!5m2!1sen!2sng" title="Marygold International School on the map" loading="lazy" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe></div>
    </div></section>
  </main>
  <footer id="site-footer" class="site-footer"></footer>
  <script src="script.js"></script>
  <script src="pages.js"></script>
</body>
</html>
